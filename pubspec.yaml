name: dot_shorthand
description: Migrate Dart code to dot shorthands (Color.red -> .red). CLI batch rewrite plus an analyzer plugin with a quick fix.
version: 1.1.1
repository: https://github.com/valentingrigorean/dot_shorthand
issue_tracker: https://github.com/valentingrigorean/dot_shorthand/issues
topics:
  - lint
  - analyzer-plugin
  - codemod
  - dot-shorthands
  - flutter

environment:
  sdk: ^3.13.2

executables:
  dot_shorthand:

dependencies:
  analysis_server_plugin: ^0.3.18
  analyzer: ">=13.3.0 <15.0.0"
  analyzer_plugin: ^0.14.12
  args: ^2.7.0
  glob: ^2.1.3
  path: ^1.9.0

dev_dependencies:
  async: ^2.13.0
  lints: ^6.0.0
  test: ^1.26.0
